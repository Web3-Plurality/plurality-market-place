name: Manual Release Docker Image Prod

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push images to ghcr.io

jobs:
  semantic_release:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          docker system prune -af
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android

      - name: Configure Git Credentials
        run: |
          git config --global user.email "plurality.web3@gmail.com"
          git config --global user.name "semantic-release-bot"

      - name: Docker Login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0   # tags needed for git describe

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Prepare Environment files
        run: |
          cp .env.production.example .env.production

      - name: Get version from latest git tag
        id: get_version
        run: |
          V=$(git describe --tags --abbrev=0)
          echo "VERSION=${V#v}" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        run: |
          docker build . --file Dockerfile --tag ghcr.io/web3-plurality/plurality-market-place:latest \
          && docker push ghcr.io/web3-plurality/plurality-market-place:latest \
          && docker tag ghcr.io/web3-plurality/plurality-market-place:latest ghcr.io/web3-plurality/plurality-market-place:${{ env.VERSION }} \
          && docker push ghcr.io/web3-plurality/plurality-market-place:${{ env.VERSION }}
